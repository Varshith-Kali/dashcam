[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dashcam"
version = "0.1.0"
description = "The dashcam for your AI coding agents — tamper-evident session receipts and cross-provider cost. Read-only."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Varshith Puli" }]
keywords = ["ai", "agents", "coding-assistant", "observability", "cost-tracking", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Logging",
]
dependencies = [
  "typer>=0.9.0",
  "rich>=13.0.0",
]

[project.scripts]
dashcam = "dashcam.cli:app"

[project.urls]
Homepage = "https://github.com/Varshith-Kali/dashcam"
Repository = "https://github.com/Varshith-Kali/dashcam"
Issues = "https://github.com/Varshith-Kali/dashcam/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dashcam"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
